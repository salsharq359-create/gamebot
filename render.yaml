# نشر جيم بوت على Render: خدمة واحدة (Django + خادم الروبوت) وقاعدة PostgreSQL.
# في Render: New ← Blueprint ← اختاري هذا المستودع. العنوان الناتج (مثل https://gamebot-xxxx.onrender.com)
# هو قيمة API_URL و REALTIME_URL معاً في GitHub.
services:
  - type: web
    name: gamebot
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Render يحوّل http إلى https بنفسه، والتحويل داخل Django يكسر اتصال خادم الروبوت بـ 127.0.0.1
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: DATABASE_HOST
        fromDatabase: {name: gamebot-db, property: host}
      - key: DATABASE_PORT
        fromDatabase: {name: gamebot-db, property: port}
      - key: DATABASE_NAME
        fromDatabase: {name: gamebot-db, property: database}
      - key: DATABASE_USER
        fromDatabase: {name: gamebot-db, property: user}
      - key: DATABASE_PASSWORD
        fromDatabase: {name: gamebot-db, property: password}

databases:
  - name: gamebot-db
    plan: free
    databaseName: gamebot
    user: gamebot
