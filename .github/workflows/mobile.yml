# بناء جيم بوت للهاتف عبر GitHub Actions.
#  • أندرويد (apk): يعمل تلقائياً مع كل دفع إلى main، ويُرفع الملف كـ artifact تحمّله من صفحة التشغيل.
#  • آيفون (ipa): يعمل فقط عند تشغيله يدوياً، وينتج IPA غير موقّع تثبّته بـ Sideloadly وحساب Apple المجاني.
#
# مطلوب قبل التشغيل: في Settings ← Secrets and variables ← Actions أضف المتغيرات (Variables):
#   API_URL       مثل https://api.yourdomain.com
#   REALTIME_URL  مثل https://api.yourdomain.com  (أو نطاق خادم socket.io)
name: mobile
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: عناوين الخوادم
        env:
          API_URL: ${{ vars.API_URL }}
          REALTIME_URL: ${{ vars.REALTIME_URL }}
        run: |
          case "$API_URL$REALTIME_URL" in
            https://*https://*) ;;
            *) echo "عرّف API_URL و REALTIME_URL كمتغيرين بصيغة https://" >&2; exit 1 ;;
          esac
          printf '{"api_url": "%s", "realtime_url": "%s"}\n' "$API_URL" "$REALTIME_URL" > app/server.json
      - name: بناء APK
        working-directory: app
        run: |
          pip install flet-cli==1.0.3
          flet build apk --exclude tests --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: gamebot-android
          path: app/build/apk/

  ios:
    # يعمل يدوياً فقط (Actions ← mobile ← Run workflow)، لأن دقائق macOS تُحسب ×10 في المستودعات الخاصة.
    # يبني IPA غير موقّع؛ برنامج Sideloadly يوقّعه بحساب Apple المجاني عند التثبيت.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: عناوين الخوادم
        env:
          API_URL: ${{ vars.API_URL }}
          REALTIME_URL: ${{ vars.REALTIME_URL }}
        run: |
          case "$API_URL$REALTIME_URL" in
            https://*https://*) ;;
            *) echo "عرّف API_URL و REALTIME_URL كمتغيرين بصيغة https://" >&2; exit 1 ;;
          esac
          printf '{"api_url": "%s", "realtime_url": "%s"}\n' "$API_URL" "$REALTIME_URL" > app/server.json
      - name: بناء iOS بدون توقيع (xcarchive)
        working-directory: app
        run: |
          pip install flet-cli==1.0.3
          flet build ipa --exclude tests --yes -v
      - name: تحويل الأرشيف إلى IPA غير موقّع
        working-directory: app
        run: |
          APP=$(find build -maxdepth 6 -type d -path "*.xcarchive/Products/Applications/*.app" | head -1)
          test -n "$APP" || { echo "لم يُعثر على ملف .app داخل الأرشيف" >&2; find build -maxdepth 4; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry GameBot-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: gamebot-ios-unsigned
          path: app/GameBot-unsigned.ipa
