# يقرأه أمر `flet build` لبناء تطبيق أندرويد (apk) وآيفون (ipa).
# غيّر org إلى نطاقك العكسي (مثل com.yourname) قبل النشر على المتجر.
[project]
name = "gamebot"
version = "1.0.0"
description = "جيم بوت: روبوت يلعب الألعاب ويجمع الأرباح (تطبيق بايثون)"
requires-python = ">=3.12"
dependencies = [
  "flet==1.0.3",
  "httpx>=0.27",
  "python-socketio[asyncio_client]>=5.11",
  "cryptography>=42",
]

[tool.flet]
org = "com.example"
product = "GameBot"
company = "GameBot"
copyright = "Copyright 2026 GameBot"
